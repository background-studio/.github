name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: node --test "scripts/test/*.test.mjs"

      # 离线校验：不使用任何令牌、不访问 GitHub API。
      # catalog 已改但清单待合并后重新生成时只告警。
      - name: Validate catalog and registry
        run: node scripts/update-registry.mjs --validate
